[package]
name = "blurt-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Blurt on Windows/Linux: drives record.py's ffmpeg engine (--status-jsonl) and opens the transparent overlay windows (region picker, island, hanging cards, note bubble)"

# Standalone crate (no [workspace] here on purpose: the Tauri app adds it as a path dependency).
#   cargo test                          engine + region + status (needs python3/uv + ffmpeg for the record.py test)
#   cargo check --no-default-features   without Tauri (cross-checks for Linux need no GTK sysroot)

[features]
default = ["overlay"]
# Overlay windows (needs Tauri 2; on Linux the webkit2gtk-4.1 / gtk3 dev packages)
overlay = ["dep:tauri", "dep:gtk"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
] }
cpal = "0.16"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Linux: the island takes clicks through an X input shape (overlay.rs `input_shape`); already in the tree through tauri
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"
